<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fractional Edge Detection</title>
        <link rel="stylesheet" href="/static/css/style.css">
    </head>
    <body>
        <h1>Детекція контурів похідними</h1>
        <div class="upload-section">
            <h3>Завантажте зображення для обробки</h3>
            <input type="file" id="fileInput" accept="image/*" required>
            <br><br>
            <div id="renameSection" style="display:none;">
                <label for="customName">Зберегти як:</label>
                <br><br>
                <div style="display:flex; align-items:center; justify-content:center; gap:4px;">
                    <input
                        type="text"
                        id="customName"
                        placeholder="filename"
                        style="padding:8px; border-radius:5px; border:1px solid #ccc; width:200px;"
                    >
                    <span id="fileExtension" style="font-weight:bold;"></span>
                </div>
                <small id="nameError" style="color:red; display:none;"></small>
            </div>
            <br>
            <button onclick="uploadImage()">Обробити зображення (Guassian Blur)</button>
        </div>

        <hr>
        <h3>Галерея останніх робіт</h3>
        <p>Тут з'являться ваші зображення після підключення бази даних.</p>

        <div class="gallery">
            {% for image in images %}
                <div class="gallery-item">
                    <img src ="/static/uploads/{{ image.filename }}" alt="{{ image.filename }}">
                    <div class="image-info">
                        {{ image.filename }}
                    </div>
                    <button
                        class="delete-btn"
                        onclick="confirmDelete('{{  image.filename }}')">
                        Delete
                    </button>
                </div>
            {% else %}
                <p>Поки що немає завантажених зображень.</p>
            {% endfor %}
        </div>
        <div id="imageModal" class="modal">
            <span class="close-btn">&times;</span>
            <img class="modal-content" id="fullImage">
            <div id="caption"></div>
        </div>
        <script src="/static/js/script.js"></script>
    </body>
</html>
