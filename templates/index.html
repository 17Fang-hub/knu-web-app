<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fractional Edge Detection</title>
        <link rel="stylesheet" href="/static/css/style.css">
    </head>
    <body>
        <h1>Детекція контурів похідними</h1>
        <div class="upload-section">
            <h3>Завантажте зображення для обробки</h3>
            <form action="/upload" method="post" enctype="multipart/form-data">
                <input type="file" name="file" accept="image/*" required>
                <br><br>
                <button type="submit">Обробити зображення (Guassian Blur)</button>
            </form>
        </div>

        <hr>
        <h3>Галерея останніх робіт</h3>
        <p>Тут з'являться ваші зображення після підключення бази даних.</p>

        <div class="gallery">
            {% for image in images %}
                <div class="gallery-item">
                    <img src ="/static/uploads/{{ image }}" alt="{{ image }}">
                    <div class="image-info">
                        {{ image }}
                    </div>
                </div>
            {% else %}
                <p>Поки що немає завантажених зображень.</p>
            {% endfor %}
        </div>
        <div id="imageModal" class="modal">
            <span class="close-btn">&times;</span>
            <img class="modal-content" id="fullImage">
            <div id="caption"></div>
        </div>
        <script src="/static/js/script.js"></script>
    </body>
</html>
